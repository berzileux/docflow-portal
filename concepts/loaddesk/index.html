<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoadDesk portal prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f8fb;
    --white: #ffffff;
    --ink: #14283f;
    --ink-soft: #4a5c72;
    --blue: #2456a6;
    --blue-dark: #183d78;
    --grid: #d6e0ee;
    --line: #c3cfdf;
    --amber: #a95a07;
    --amber-bg: #fdf0dc;
    --green: #1b6e47;
    --green-bg: #e1f3e9;
    --slate-bg: #e8edf4;
    --sky-bg: #dde9fa;
    --head: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--body); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--paper); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--head); font-weight: 600; letter-spacing: 0.01em; margin: 0; line-height: 1.15; }
  h1 { font-size: 34px; } h2 { font-size: 24px; } h3 { font-size: 18px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--blue); }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; border: 1px solid var(--blue); background: var(--blue); color: #fff; font-weight: 600; border-radius: 3px; cursor: pointer; min-height: 42px; }
  .btn:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
  .btn.ghost { background: transparent; color: var(--blue); }
  .btn.ghost:hover { background: var(--sky-bg); }
  .btn.small { padding: 6px 12px; min-height: 34px; font-size: 14px; }
  .btn.green { background: var(--green); border-color: var(--green); }
  .btn.green:hover { background: #14573a; border-color: #14573a; }

  /* login */
  .login { min-height: 100vh; display: grid; grid-template-columns: 1.15fr 1fr; }
  .login-art { position: relative; background: var(--ink); color: #fff; padding: 56px 56px 40px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
  .login-art::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(130,170,230,.16) 1px, transparent 1px), linear-gradient(90deg, rgba(130,170,230,.16) 1px, transparent 1px); background-size: 32px 32px; }
  .login-art > * { position: relative; }
  .brand { font-family: var(--head); font-size: 26px; font-weight: 700; letter-spacing: .02em; }
  .brand span { color: #8fb4ee; }
  .login-art h1 { font-size: 46px; max-width: 14ch; margin: 28px 0 14px; }
  .login-art p { color: #c4d3ea; max-width: 38ch; margin: 0; font-size: 18px; }
  .plan-svg { width: 100%; max-width: 520px; margin-top: 28px; }
  .art-note { color: #9db3d3; font-size: 14px; }
  .login-form-wrap { display: flex; align-items: center; justify-content: center; padding: 40px 28px; }
  .login-form { width: 100%; max-width: 400px; }
  .login-form h2 { margin-bottom: 6px; }
  .login-form .sub { color: var(--ink-soft); margin: 0 0 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field label { font-weight: 600; font-size: 15px; }
  .field input, .field select, .field textarea { padding: 10px 12px; border: 1px solid var(--line); background: var(--white); border-radius: 3px; min-height: 42px; }
  .field textarea { min-height: 84px; resize: vertical; }
  .field .hint { font-size: 14px; color: var(--ink-soft); }
  .error { background: #fde8e6; color: #8d1f14; padding: 10px 12px; border-radius: 3px; margin-bottom: 16px; font-size: 15px; }
  .demo-box { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }
  .demo-box p { margin: 0 0 8px; font-size: 14px; color: var(--ink-soft); }
  .demo-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  /* shell */
  .topbar { background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; height: 58px; gap: 16px; }
  .topbar .brand { font-size: 22px; }
  .topbar .who { display: flex; align-items: center; gap: 16px; font-size: 15px; color: #d4e0f3; flex-wrap: wrap; justify-content: flex-end; }
  .topbar .tenant { color: #fff; font-weight: 600; }
  .role-tag { background: #8fb4ee; color: var(--ink); font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 99px; }
  .linkbtn { background: none; border: 0; color: #9cc0f5; cursor: pointer; padding: 4px 0; text-decoration: underline; }
  .page .linkbtn, .panel .linkbtn { color: var(--blue); }
  .page { max-width: 1120px; margin: 0 auto; padding: 28px 28px 64px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .page-head p { margin: 4px 0 0; color: var(--ink-soft); }

  /* demo bar */
  .demobar { background: var(--amber-bg); border-bottom: 1px solid #ecd2a8; padding: 8px 28px; font-size: 14px; color: #6d3b04; }
  .demobar .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .demobar .lbl { font-weight: 600; margin-right: 4px; }
  .pbtn { border: 1px solid #d9b57f; background: #fff8ec; color: #6d3b04; padding: 4px 11px; border-radius: 99px; cursor: pointer; font-size: 14px; }
  .pbtn:hover { background: #fff; }
  .pbtn[aria-pressed="true"] { background: #6d3b04; color: #fff; border-color: #6d3b04; }
  .demobar .sep { width: 1px; height: 20px; background: #d9b57f; margin: 0 4px; }
  .demobar summary { cursor: pointer; font-weight: 600; }
  .demobar p { margin: 8px 0 2px; }

  /* story bar: shows only the current step */
  .storybar { background: var(--sky-bg); border-bottom: 2px solid var(--blue); padding: 12px 28px; }
  .storybar .sb-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .storybar .sb-head strong { font-family: var(--head); font-size: 19px; }
  .storybar .sb-body { display: flex; align-items: center; justify-content: flex-start; gap: 20px; flex-wrap: wrap; margin-top: 6px; }
  .storybar p { margin: 0; font-size: 17px; max-width: 80ch; }
  .sb-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .dots { display: inline-flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--blue); background: transparent; }
  .dot.done { background: var(--blue); }
  .dot.now { background: #fff; box-shadow: 0 0 0 3px rgba(36,86,166,.25); }
  .login.withbar { min-height: calc(100vh - 92px); }

  /* google-style sign-in (simulated) */
  .gbtn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 11px 16px; border: 1px solid var(--line); background: var(--white); border-radius: 3px; cursor: pointer; font-weight: 600; min-height: 46px; }
  .gbtn:hover { background: var(--paper); }
  .gbtn .g { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .modal-back { position: fixed; inset: 0; background: rgba(20,40,63,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  .modal { background: var(--white); width: 100%; max-width: 420px; padding: 22px; border-radius: 3px; max-height: 90vh; overflow: auto; }
  .acct-list { display: flex; flex-direction: column; gap: 6px; }
  .acct { display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; border: 1px solid var(--line); background: var(--white); border-radius: 3px; cursor: pointer; }
  .acct:hover { background: var(--paper); }
  .acct .av { width: 34px; height: 34px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; }
  .acct .who2 { display: flex; flex-direction: column; }
  .reg-add { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 12px; }
  .reg-add .field { margin: 0; }

  /* strip, toolbar, tables */
  .strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: var(--white); margin-bottom: 22px; }
  .strip.five { grid-template-columns: repeat(5, 1fr); }
  .strip button { text-align: left; background: none; border: 0; border-right: 1px solid var(--line); padding: 14px 18px; cursor: pointer; }
  .strip button:last-child { border-right: 0; }
  .strip button:hover { background: var(--paper); }
  .strip button[aria-pressed="true"] { background: var(--sky-bg); box-shadow: inset 0 -3px 0 var(--blue); }
  .strip .n { font-family: var(--head); font-size: 30px; font-weight: 600; line-height: 1; display: block; }
  .strip .l { font-size: 14px; color: var(--ink-soft); }
  .toolbar { display: flex; gap: 12px; margin-bottom: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .toolbar input { padding: 9px 12px; border: 1px solid var(--line); border-radius: 3px; background: var(--white); min-width: 260px; min-height: 40px; }
  table.projects { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid var(--line); margin-bottom: 8px; }
  table.projects th { text-align: left; font-weight: 600; font-size: 14px; color: var(--ink-soft); padding: 10px 14px; border-bottom: 2px solid var(--ink); }
  table.projects td { padding: 12px 14px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  table.projects tr.row { cursor: pointer; }
  table.projects tr.row:hover td { background: var(--paper); }
  table.projects select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--white); min-height: 34px; }
  .pid { font-family: var(--head); font-weight: 600; font-size: 17px; }
  .addr { font-weight: 600; }
  .muted { color: var(--ink-soft); font-size: 14px; }
  .empty { padding: 30px 20px; text-align: center; background: var(--white); border: 1px solid var(--line); border-top: 0; color: var(--ink-soft); }
  .section-title { margin: 26px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .section-title p { margin: 0; color: var(--ink-soft); font-size: 14px; }

  .chip { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip.Received { background: var(--slate-bg); color: #364a63; }
  .chip.In-design { background: var(--sky-bg); color: var(--blue-dark); }
  .chip.Needs-info { background: var(--amber-bg); color: var(--amber); }
  .chip.Ready { background: var(--green-bg); color: var(--green); }
  .src { display: inline-block; font-size: 13px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 3px; background: var(--white); white-space: nowrap; }
  .src.Client-portal { border-color: var(--blue); color: var(--blue-dark); background: var(--sky-bg); }
  .src.Email, .src.Website-chat { border-style: dashed; color: var(--ink-soft); }

  /* wizard and panels */
  .steps { display: flex; margin-bottom: 26px; border: 1px solid var(--line); background: var(--white); }
  .steps div { flex: 1; padding: 12px 16px; border-right: 1px solid var(--line); color: var(--ink-soft); font-size: 15px; }
  .steps div:last-child { border-right: 0; }
  .steps div.on { background: var(--ink); color: #fff; font-weight: 600; }
  .steps div.done { color: var(--green); font-weight: 600; }
  .panel { background: var(--white); border: 1px solid var(--line); padding: 26px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
  .checks { display: flex; gap: 18px; flex-wrap: wrap; }
  .checks label { display: flex; gap: 8px; align-items: center; font-weight: 500; }
  .drop { border: 2px dashed var(--blue); background: var(--sky-bg); padding: 34px 20px; text-align: center; cursor: pointer; border-radius: 3px; }
  .drop:hover { background: #d0e1f9; }
  .drop strong { font-family: var(--head); font-size: 20px; display: block; margin-bottom: 4px; }
  .filelist { list-style: none; padding: 0; margin: 16px 0 0; }
  .filelist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--grid); border-bottom: 0; background: var(--paper); }
  .filelist li:last-child { border-bottom: 1px solid var(--grid); }
  .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  .review-list { list-style: none; padding: 0; margin: 12px 0 18px; }
  .review-list li { padding: 10px 12px; border-left: 4px solid var(--line); background: var(--paper); margin-bottom: 8px; }
  .review-list li.ok { border-left-color: var(--green); }
  .review-list li.miss { border-left-color: var(--amber); background: var(--amber-bg); }
  .note { padding: 12px 14px; background: var(--sky-bg); border-left: 4px solid var(--blue); font-size: 15px; margin-bottom: 18px; }
  .note.warn { background: var(--amber-bg); border-left-color: var(--amber); }

  /* detail */
  .crumb { margin-bottom: 14px; font-size: 15px; }
  .titleblock { display: grid; grid-template-columns: 2.2fr 1fr 1fr 1fr; border: 2px solid var(--ink); background: var(--white); margin-bottom: 24px; }
  .titleblock > div { padding: 12px 16px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); min-width: 0; }
  .titleblock > div:nth-child(4n) { border-right: 0; }
  .titleblock > div:nth-last-child(-n+4) { border-bottom: 0; }
  .titleblock .k { font-size: 13px; color: var(--ink-soft); }
  .titleblock .v { font-family: var(--head); font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
  .titleblock .big { grid-row: span 2; display: flex; flex-direction: column; justify-content: center; }
  .titleblock .big .v { font-size: 26px; }
  .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: start; }
  .block { background: var(--white); border: 1px solid var(--line); padding: 20px 22px; margin-bottom: 24px; }
  .block h3 { margin-bottom: 12px; }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li { position: relative; padding: 0 0 18px 30px; color: var(--ink-soft); }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before { content: ""; position: absolute; left: 6px; top: 22px; bottom: -2px; width: 2px; background: var(--line); }
  .timeline li:last-child::before { display: none; }
  .timeline li::after { content: ""; position: absolute; left: 0; top: 4px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--white); }
  .timeline li.done { color: var(--ink); }
  .timeline li.done::before { background: var(--green); }
  .timeline li.done::after { background: var(--green); border-color: var(--green); }
  .timeline li.now { color: var(--ink); font-weight: 600; }
  .timeline li.now::after { border-color: var(--blue); background: var(--sky-bg); }
  .timeline li.flag::after { border-color: var(--amber); background: var(--amber-bg); }
  .timeline .when { display: block; font-weight: 400; font-size: 14px; color: var(--ink-soft); }
  .loads { display: grid; grid-template-columns: repeat(2, 1fr); border: 1px solid var(--ink); }
  .loads > div { padding: 12px 14px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); }
  .loads > div:nth-child(2n) { border-right: 0; }
  .loads > div:nth-last-child(-n+2) { border-bottom: 0; }
  .loads .k { font-size: 13px; color: var(--ink-soft); }
  .loads .v { font-family: var(--head); font-size: 24px; font-weight: 600; }
  .loads .u { font-size: 14px; font-weight: 400; color: var(--ink-soft); }
  .docs { list-style: none; padding: 0; margin: 0; }
  .docs li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .docs li:last-child { border-bottom: 0; }
  .need { margin: 0 0 14px; padding-left: 20px; }
  .thread { list-style: none; padding: 0; margin: 0 0 14px; }
  .thread li { padding: 10px 12px; background: var(--paper); border-left: 4px solid var(--line); margin-bottom: 8px; }
  .thread li.you { border-left-color: var(--blue); background: var(--sky-bg); }
  .thread .by { font-size: 13px; color: var(--ink-soft); display: block; }
  .log { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  .log li { padding: 7px 0; border-bottom: 1px solid var(--grid); display: flex; gap: 10px; }
  .log li:last-child { border-bottom: 0; }
  .log .d { color: var(--ink-soft); min-width: 86px; }

  /* firm work screen */
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .file { border: 1px solid var(--line); background: var(--paper); }
  .file .thumb { height: 92px; background: repeating-linear-gradient(0deg, #e3ebf6 0 1px, transparent 1px 14px), repeating-linear-gradient(90deg, #e3ebf6 0 1px, transparent 1px 14px); display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 13px; border-bottom: 1px solid var(--line); }
  .file .nm { padding: 8px 10px; font-size: 14px; overflow-wrap: anywhere; }
  .file button { margin: 0 10px 10px; }
  table.takeoff { width: 100%; border-collapse: collapse; }
  table.takeoff th { text-align: left; font-size: 14px; color: var(--ink-soft); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--ink); }
  table.takeoff td { padding: 10px; border-bottom: 1px solid var(--grid); }
  .conf { font-size: 13px; padding: 2px 8px; border-radius: 99px; }
  .conf.High { background: var(--green-bg); color: var(--green); }
  .conf.Medium { background: var(--sky-bg); color: var(--blue-dark); }
  .conf.Low { background: var(--amber-bg); color: var(--amber); }
  .askrow { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .askrow label { display: flex; gap: 8px; align-items: center; font-weight: 500; }
  .divider { border: 0; border-top: 1px solid var(--grid); margin: 18px 0; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 3px; max-width: 90vw; box-shadow: 0 6px 24px rgba(20,40,63,.3); z-index: 10; }

  @media (max-width: 900px) {
    .login { grid-template-columns: 1fr; }
    .login-art { padding: 32px 24px; }
    .login-art h1 { font-size: 36px; }
    .plan-svg { display: none; }
    .cols { grid-template-columns: 1fr; }
    .titleblock { grid-template-columns: 1fr 1fr; }
    .titleblock > div { border-right: 1px solid var(--ink) !important; border-bottom: 1px solid var(--ink) !important; }
    .titleblock > div:nth-child(2n) { border-right: 0 !important; }
    .titleblock .big { grid-row: auto; grid-column: span 2; }
    .strip, .strip.five { grid-template-columns: repeat(2, 1fr); }
    .strip button { border-bottom: 1px solid var(--line); }
    .two { grid-template-columns: 1fr; }
    .steps div { padding: 10px 8px; font-size: 13px; }
    .page { padding: 22px 16px 56px; }
    .demobar { padding: 8px 16px; }
    .storybar { padding: 12px 16px; }
    .story { grid-template-columns: 1fr; }
    table.projects .hide-sm { display: none; }
    .toolbar input { min-width: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

      ['Window schedule', 'Front door orientation', 'A clearer copy of the plans', 'Equipment preference'].map(function (x) { return '<label><input type="checkbox" class="ri" value="' + esc(x) + '"> ' + esc(x) + '</label>'; }).join("") + '</div></div>' +
      '<div class="field"><label for="ri-note">Note to client (optional)</label><textarea id="ri-note" placeholder="Anything else the client should know"></textarea></div>' +
      '<button class="btn ghost small" onclick="requestInfo(\'' + p.id + '\')">Send request to client</button>' +
      '<hr class="divider"><button class="btn green" onclick="markReady(\'' + p.id + '\')">Mark ready and deliver</button>' +
      '<p class="muted" style="margin:10px 0 0">The load calculation itself runs in the approved calculation software. Marking ready here stands in for attaching that report.</p>';
  }
  act += '</section>';

  var thread = '<section class="block"><h3>Client messages</h3>' + (p.thread.length ?
    '<ul class="thread">' + p.thread.map(function (m) { return '<li class="' + (m.by === "You" ? "you" : "") + '"><span class="by">' + esc(m.by === "You" ? "Client" : m.by) + '</span>' + esc(m.text) + '</li>'; }).join("") + '</ul>' :
    '<p class="muted" style="margin:0">No messages yet.</p>') + '</section>';
  var log = '<section class="block"><h3>Activity</h3><ul class="log">' +
    p.log.slice().reverse().map(function (l) { return '<li><span class="d">' + esc(l.when) + '</span><span>' + esc(l.text) + '</span></li>'; }).join("") + '</ul></section>';

  return shell(back + tb + '<div class="cols"><div>' + left + '</div><div>' + act + thread + log + '</div></div>');
}
function requestInfo(id) {
  var p = find(id);
  var picks = Array.prototype.map.call(document.querySelectorAll(".ri:checked"), function (el) { return el.value; });
  var note = document.getElementById("ri-note").value.trim();
  if (!picks.length && !note) { toast("Pick at least one item or write a note."); return; }
  p.missing = picks.length ? picks : [note];
  p.status = "Needs info";
  p.thread.push({ by: "Design team", text: note || ("We need a few items before we can continue: " + picks.join(", ") + ".") });
  addLog(p, whoAmI() + " asked the client for: " + (picks.length ? picks.join(", ") : "a note") + ".");
  toast("Request sent. The client sees it as Needs info.");
  render();
}
function markReady(id) {
  var p = find(id);
  var rows = takeoffRows(p);
  var ok = rows.every(function (r, i) { return confirmedAt(p, i); });
  if (!ok) { toast("Confirm every input before marking this ready."); return; }
  var area = isNaN(Number(p.sqft)) ? 2100 : Number(p.sqft);
  var cooling = Math.round(area * 13.2 / 100) * 100;
  p.results = { cooling: cooling, heating: Math.round(area * 6.6 / 100) * 100, tons: Math.round(cooling / 12000 * 10) / 10, cfm: Math.round(cooling / 12000 * 400 / 10) * 10, sensible: 0.76, indoor: DESIGN_RES.indoor, outdoor: DESIGN_RES.outdoor };
  p.status = "Ready"; p.missing = [];
  p.thread.push({ by: "Design team", text: "Report delivered. Let us know if anything changes before permit." });
  addLog(p, "Marked ready by " + whoAmI() + ".");
  toast(id + " delivered. The client can download it now.");
  render();
}

/* ---------- story helpers ---------- */
function fastForward() {
  var p = find(state.storyProject);
  if (!p || p.status === "Needs info") return;
  p.assignee = p.assignee || "designer1";
  p.status = "Needs info";
  p.missing = ["Is the garage conditioned space?"];
  p.thread.push({ by: "Design team", text: "Quick question while reviewing the plans: is the garage conditioned space?" });
  addLog(p, "Designer asked the client a question.");
  state.story = "B2";
  render();
}
function replay() {
  PROJECTS = JSON.parse(INITIAL);
  REGISTERED = JSON.parse(INITIAL_REG);
  nextNum = 1055;
  state.tenant = null; state.staff = null; state.projectId = null; state.storyProject = null;
  state.filter = "All"; state.query = ""; state.error = ""; state.step = 1; state.draft = null; state.story = "A"; state.userName = null; state.picker = false;
  go("login");
}
function endStory() { state.story = "X"; render(); }

/* ---------- router ---------- */
function render() {
  var app = document.getElementById("app");
  var signedIn = state.tenant || state.staff;
  if (state.view !== "login" && !signedIn) state.view = "login";
  if ((state.view === "fdash" || state.view === "fwork") && !state.staff) state.view = "dashboard";
  if ((state.view === "dashboard" || state.view === "new" || state.view === "project") && !state.tenant) state.view = state.staff ? "fdash" : "login";
  if (state.view === "login") app.innerHTML = viewLogin();
  else if (state.view === "dashboard") { app.innerHTML = viewDashboard(); var s = document.getElementById("search"); if (s && state.query) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
  else if (state.view === "new") app.innerHTML = viewNew();
  else if (state.view === "project") app.innerHTML = viewProject();
  else if (state.view === "fdash") app.innerHTML = viewFdash();
  else if (state.view === "fwork") app.innerHTML = viewWork();
}
render();
</script>
</body>
</html>
